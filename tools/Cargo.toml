[package]
name = "fastnbt-tools"
description = "tools built with fastnbt"
version = "0.27.0"
authors = ["Owen Gage <owengage@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
fastsnbt = { path = "../fastsnbt", version = "0.3.0" }
fastnbt = { path = "../fastnbt", version = "2" }
fastanvil = { path = "../fastanvil", version = "0.32" }
rayon = "1.3.0"
flate2 = "1.0"
image = "0.24"
clap = "4"
regex = "1"
serde_json = "1.0"
serde = { version = "1.0.111", features = ["derive"] }
tar = "0.4.46"
log = "0.4"
env_logger = "0.11"
